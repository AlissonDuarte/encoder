version: '3'

services:

  app:
    build: .
    volumes:
      - .:/go/src/

  rabbit:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: secret_cookie

    ports:
      - "15672:15672"
      - "5672:5672"
      